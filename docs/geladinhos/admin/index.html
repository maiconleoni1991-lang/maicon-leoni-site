<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff0f68">
<title>Geladinho dos Sonhos — Administração</title>
<style>
:root{--p:#ff0f68;--w:#4a101e;--line:#efdde4;--muted:#78616a}*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#fff8fb;color:#29171d}body{display:flex;flex-direction:column}.bar{flex:none;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 6px 24px #64163112;z-index:5}.top{max-width:1180px;margin:auto;padding:8px 14px;display:flex;align-items:center;gap:10px}.logo{width:52px;height:52px;object-fit:contain}.brand{min-width:0}.brand b{display:block;color:var(--w);font-size:16px}.brand small{color:var(--muted)}.tabs{margin-left:auto;display:flex;gap:7px;align-items:center}.tabs button{border:1px solid var(--line);background:#fff;color:var(--w);padding:9px 12px;border-radius:12px;font-weight:850;cursor:pointer}.tabs button.on{background:var(--p);color:#fff;border-color:var(--p)}.tabs .refresh{display:none}.tabs .refresh.show{display:block}.stage{position:relative;flex:1;min-height:0}.view{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}.view.on{display:block}.previewTag{display:none;position:absolute;right:14px;bottom:14px;z-index:3;background:#4a101ee8;color:#fff;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:800;box-shadow:0 8px 22px #0003}.previewTag.show{display:block}@media(max-width:720px){.top{flex-wrap:wrap}.brand{flex:1}.tabs{order:3;width:100%;margin:0;display:grid;grid-template-columns:1fr 1fr}.tabs button{padding:9px 7px;font-size:12px}.logo{width:44px;height:44px}}
</style>
</head>
<body>
<div class="bar"><div class="top"><img class="logo" src="../assets/logo-oficial.webp?v=6" alt="Geladinho dos Sonhos"><div class="brand"><b>Geladinho dos Sonhos</b><small>Administração + visão do cliente</small></div><div class="tabs"><button id="adminTab" class="on">⚙️ Administrar</button><button id="clientTab">👁️ Loja (cliente)</button><button id="refreshBtn" class="refresh">↻ Atualizar prévia</button></div></div></div>
<div class="stage"><iframe id="adminFrame" class="view on" src="manage.html" title="Painel administrativo"></iframe><iframe id="clientFrame" class="view" src="../?preview=1" title="Loja como cliente"></iframe><div id="previewTag" class="previewTag">Prévia da loja real</div></div>
<script>
const a=document.getElementById('adminFrame'),c=document.getElementById('clientFrame'),at=document.getElementById('adminTab'),ct=document.getElementById('clientTab'),rb=document.getElementById('refreshBtn'),tag=document.getElementById('previewTag');
function refreshPreview(){c.src='../?preview=1&t='+Date.now()}
function show(which){const client=which==='client';a.classList.toggle('on',!client);c.classList.toggle('on',client);at.classList.toggle('on',!client);ct.classList.toggle('on',client);rb.classList.toggle('show',client);tag.classList.toggle('show',client);if(client)refreshPreview()}
at.onclick=()=>show('admin');ct.onclick=()=>show('client');rb.onclick=refreshPreview;
// O painel original continua isolado em manage.html. Como é do mesmo site, podemos observar a lista de produtos.
a.addEventListener('load',()=>{try{const doc=a.contentDocument;const rows=doc&&doc.getElementById('productRows');if(!rows)return;let first=true;const obs=new MutationObserver(()=>{if(first){first=false;return}setTimeout(refreshPreview,250)});obs.observe(rows,{childList:true,subtree:true});}catch(e){console.warn(e)}});
</script>
</body></html>
