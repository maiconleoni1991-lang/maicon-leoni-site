<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff0f68"><title>Relatórios — Geladinho dos Sonhos</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script><style>:root{--p:#ff0f68;--w:#4a101e;--line:#efdde4;--muted:#78616a;--g:#19b15b;--bg:#fff8fb}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial;background:var(--bg);color:#29171d}.wrap{max-width:1180px;margin:auto;padding:14px}.head{position:sticky;top:0;z-index:20;background:#fffafcee;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);margin:-14px -14px 14px;padding:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.head h1{margin:0;color:var(--w);font-size:24px}.head small{display:block;color:var(--muted);font-size:11px}.actions{margin-left:auto;display:flex;gap:7px}.actions button,.filters button{border:1px solid var(--line);background:#fff;color:var(--w);border-radius:12px;padding:10px 12px;font-weight:900}.actions .primary,.filters button.on{background:var(--p);color:#fff;border-color:var(--p)}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.custom{display:none;gap:7px;align-items:end;flex-wrap:wrap;margin-bottom:12px}.custom.show{display:flex}.custom label{font-size:11px;color:var(--muted);font-weight:800}.custom input{display:block;margin-top:4px;border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 12px 30px rgba(99,23,51,.06)}.card small{color:var(--muted);font-size:11px}.card b{display:block;color:var(--w);font-size:25px;margin-top:5px}.card .accent{color:var(--p)}.section{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;margin:12px 0;box-shadow:0 12px 30px rgba(99,23,51,.05)}.section h2{margin:0 0 12px;color:var(--w);font-size:18px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid #f4e6eb;font-size:12px}.table th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.04em}.table td b{color:var(--w)}.barrow{display:grid;grid-template-columns:minmax(100px,1fr) 2fr auto;align-items:center;gap:8px;margin:9px 0;font-size:12px}.bar{height:10px;background:#f5e4eb;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff0f68,#ff7cab);border-radius:99px}.empty{text-align:center;color:var(--muted);padding:35px}.warn{background:#fff0f5;border:1px solid #ffc9db;padding:14px;border-radius:14px}.foot{font-size:11px;color:var(--muted);text-align:right;margin:8px 0}@media(max-width:820px){.cards{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.actions{width:100%;margin:0}.actions button{flex:1}.filters{display:grid;grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.wrap{padding:10px}.head{margin:-10px -10px 10px;padding:10px}.cards{gap:7px}.card{padding:11px}.card b{font-size:20px}}@media print{.head,.filters,.custom,.actions{display:none!important}body{background:#fff}.wrap{max-width:none}.section,.card{box-shadow:none;break-inside:avoid}}</style></head><body><div class="wrap"><div class="head"><div><h1>📊 Relatório de vendas</h1><small>Somente pedidos finalizados entram no faturamento.</small></div><div class="actions"><button id="csv" class="primary">⬇ Exportar CSV</button><button id="print">🖨 Imprimir / PDF</button></div></div><div id="msg"></div><div class="filters"><button data-p="today">Hoje</button><button data-p="7">7 dias</button><button data-p="30" class="on">30 dias</button><button data-p="month">Este mês</button><button data-p="custom">Personalizado</button></div><div id="custom" class="custom"><label>De<input id="from" type="date"></label><label>Até<input id="to" type="date"></label><button id="apply" class="primary">Aplicar período</button></div><div id="cards" class="cards"></div><div class="split"><section class="section"><h2>Vendas por dia</h2><div id="daily"></div></section><section class="section"><h2>Produtos mais vendidos</h2><div id="products"></div></section></div><section class="section"><h2>Pedidos finalizados no período</h2><div id="orders" class="tableWrap"></div></section><div id="foot" class="foot"></div></div><script>const {createClient}=supabase,sb=createClient('https://qpqruhcspbdxjcnbhdhn.supabase.co','sb_publishable_JVYvfl7nrRmlm17qF_KI8A_1H8mtvLk'),$=x=>document.getElementById(x),money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});let rows=[],period='30',range=null;async function admin(){const {data:{session}}=await sb.auth.getSession();if(!session)return false;const {data}=await sb.from('admin_users').select('user_id').maybeSingle();return !!data}function startDay(d){const x=new Date(d);x.setHours(0,0,0,0);return x}function endDay(d){const x=new Date(d);x.setHours(23,59,59,999);return x}function calcRange(p){const now=new Date(),end=endDay(now),start=new Date(now);if(p==='today')return [startDay(now),end];if(p==='7'){start.setDate(start.getDate()-6);return[startDay(start),end]}if(p==='30'){start.setDate(start.getDate()-29);return[startDay(start),end]}if(p==='month')return[new Date(now.getFullYear(),now.getMonth(),1),end];if(p==='custom'&&range)return range;return[startDay(now),end]}function dateKey(v){return new Date(v).toLocaleDateString('pt-BR')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){if(!await admin()){$('msg').innerHTML='<div class="warn">Entre primeiro na aba <b>Produtos / Estoque</b> com sua conta de administrador.</div>';$('cards').innerHTML='';return}const [a,b]=calcRange(period);const {data,error}=await sb.from('orders').select('id,public_code,customer_name,fulfillment,subtotal,delivery_fee,total,status,created_at,order_items(product_name,unit_price,quantity)').eq('status','Finalizado').gte('created_at',a.toISOString()).lte('created_at',b.toISOString()).order('created_at',{ascending:false}).limit(1000);if(error){$('msg').textContent=error.message;return}rows=data||[];render(a,b)}function render(a,b){const total=rows.reduce((s,o)=>s+Number(o.total||0),0),count=rows.length,ticket=count?total/count:0,items=rows.flatMap(o=>o.order_items||[]),qty=items.reduce((s,i)=>s+Number(i.quantity||0),0),delivery=rows.filter(o=>o.fulfillment==='entrega').length,pickup=count-delivery;$('cards').innerHTML=`<div class="card"><small>Faturamento</small><b class="accent">${money(total)}</b></div><div class="card"><small>Pedidos finalizados</small><b>${count}</b></div><div class="card"><small>Ticket médio</small><b>${money(ticket)}</b></div><div class="card"><small>Geladinhos vendidos</small><b>${qty}</b></div>`;const days={};rows.forEach(o=>{const k=dateKey(o.created_at);days[k]??={total:0,count:0};days[k].total+=Number(o.total||0);days[k].count++});const drows=Object.entries(days);$('daily').innerHTML=drows.length?`<div class="tableWrap"><table class="table"><thead><tr><th>Dia</th><th>Pedidos</th><th>Vendas</th></tr></thead><tbody>${drows.map(([d,x])=>`<tr><td><b>${d}</b></td><td>${x.count}</td><td>${money(x.total)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Sem vendas finalizadas neste período.</div>';const prod={};items.forEach(i=>{const k=i.product_name||'Produto';prod[k]??={q:0,total:0};prod[k].q+=Number(i.quantity||0);prod[k].total+=Number(i.unit_price||0)*Number(i.quantity||0)});const ps=Object.entries(prod).sort((a,b)=>b[1].q-a[1].q),max=Math.max(1,...ps.map(x=>x[1].q));$('products').innerHTML=ps.length?ps.slice(0,10).map(([n,x])=>`<div class="barrow"><span>${esc(n)}</span><div class="bar"><i style="width:${(x.q/max)*100}%"></i></div><b>${x.q} un.</b></div>`).join(''):'<div class="empty">Sem produtos vendidos neste período.</div>';$('orders').innerHTML=rows.length?`<table class="table"><thead><tr><th>Data</th><th>Pedido</th><th>Cliente</th><th>Tipo</th><th>Itens</th><th>Total</th></tr></thead><tbody>${rows.map(o=>`<tr><td>${new Date(o.created_at).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}</td><td><b>#${esc(o.public_code)}</b></td><td>${esc(o.customer_name)}</td><td>${o.fulfillment==='entrega'?'Entrega':'Retirada'}</td><td>${(o.order_items||[]).reduce((s,i)=>s+Number(i.quantity||0),0)}</td><td><b>${money(o.total)}</b></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhum pedido finalizado.</div>';$('foot').textContent=`Período: ${a.toLocaleDateString('pt-BR')} a ${b.toLocaleDateString('pt-BR')} · Entregas: ${delivery} · Retiradas: ${pickup} · Atualizado ${new Date().toLocaleString('pt-BR')}`}function csv(){if(!rows.length)return alert('Não há vendas finalizadas para exportar neste período.');const head=['Data','Pedido','Cliente','Tipo','Subtotal','Taxa entrega','Total','Itens'];const lines=[head,...rows.map(o=>[new Date(o.created_at).toLocaleString('pt-BR'),o.public_code,o.customer_name,o.fulfillment==='entrega'?'Entrega':'Retirada',Number(o.subtotal||0).toFixed(2).replace('.',','),Number(o.delivery_fee||0).toFixed(2).replace('.',','),Number(o.total||0).toFixed(2).replace('.',','),(o.order_items||[]).map(i=>`${i.quantity}x ${i.product_name}`).join(' | ')])];const text='\ufeff'+lines.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n'),blob=new Blob([text],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='relatorio-vendas-geladinho-dos-sonhos.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('on'));b.classList.add('on');period=b.dataset.p;$('custom').classList.toggle('show',period==='custom');if(period!=='custom')load()});$('apply').onclick=()=>{if(!$('from').value||!$('to').value)return alert('Escolha as duas datas.');const a=startDay(new Date($('from').value+'T12:00:00')),b=endDay(new Date($('to').value+'T12:00:00'));if(a>b)return alert('A data inicial deve ser anterior à final.');range=[a,b];load()};$('csv').onclick=csv;$('print').onclick=()=>window.print();load();</script></body></html>
