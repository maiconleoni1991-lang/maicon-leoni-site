<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff0f68"><title>Pedidos — Geladinho dos Sonhos</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script><style>:root{--p:#ff0f68;--w:#4a101e;--line:#efdde4;--muted:#78616a;--g:#19b15b}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial;background:#fff8fb;color:#29171d}.wrap{max-width:1050px;margin:auto;padding:18px}.head{display:flex;align-items:center;gap:10px;margin-bottom:14px}.head h1{margin:0;color:var(--w)}.head button{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.order{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 12px 30px #63173312}.new{border:2px solid var(--p)}.tag{display:inline-block;background:var(--p);color:#fff;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:900}.order h3{margin:9px 0}.order p{margin:5px 0;color:var(--muted);font-size:13px}.items{background:#fff7fa;border-radius:10px;padding:9px;margin:10px 0;font-size:12px}.item{display:flex;justify-content:space-between;gap:8px;margin:4px 0}.quick{display:grid;grid-template-columns:1fr 1fr;gap:7px}.quick button{border:0;border-radius:10px;padding:9px;font-weight:900}.yes{background:var(--g);color:#fff}.no{background:#ffe9ee;color:#a91e3e}.order select{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:9px}.empty{text-align:center;color:var(--muted);padding:40px}.warn{background:#fff0f5;border:1px solid #ffc9db;padding:14px;border-radius:14px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="head"><h1>Pedidos</h1><button id="notify">🔔 Ativar notificações</button></div><div id="msg"></div><div id="grid" class="grid"></div></div><script>const {createClient}=supabase,sb=createClient('https://qpqruhcspbdxjcnbhdhn.supabase.co','sb_publishable_JVYvfl7nrRmlm17qF_KI8A_1H8mtvLk'),$=x=>document.getElementById(x),money=v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});let seen=new Set(),ready=false;async function admin(){const {data:{session}}=await sb.auth.getSession();if(!session)return false;const {data}=await sb.from('admin_users').select('user_id').maybeSingle();return !!data}function address(o){if(o.fulfillment!=='entrega'||!o.address)return '🏠 Retirada no local';const a=o.address;return `🛵 ${a.street||''}, ${a.number||''} · ${a.district||''}`;}function ping(o){try{if(Notification.permission==='granted')new Notification('Novo pedido #'+o.public_code,{body:o.customer_name+' · '+money(o.total),icon:'../assets/logo-oficial.webp'})}catch(_){}}async function load(){if(!await admin()){$('msg').innerHTML='<div class="warn">Entre primeiro na aba <b>Administrar</b> com sua conta.</div>';$('grid').innerHTML='';return}const {data,error}=await sb.from('orders').select('*,order_items(*)').order('created_at',{ascending:false}).limit(100);if(error){$('msg').textContent=error.message;return}const orders=data||[];if(ready)orders.filter(o=>o.status==='Pedido recebido'&&!seen.has(o.id)).forEach(ping);orders.forEach(o=>seen.add(o.id));ready=true;render(orders)}function render(orders){const st=['Pedido recebido','Aceito','Em preparação','Saiu para entrega','Entregue','Cancelado'];$('grid').innerHTML=orders.length?orders.map(o=>`<article class="order ${o.status==='Pedido recebido'?'new':''}">${o.status==='Pedido recebido'?'<span class="tag">🔔 NOVO PEDIDO</span>':''}<h3>#${o.public_code} · ${o.customer_name}</h3><p><b>${money(o.total)}</b> · ${o.fulfillment==='entrega'?'Entrega':'Retirada'}</p><p>📱 ${o.customer_phone||'—'}</p><p>${address(o)}</p>${o.notes?`<p>📝 ${o.notes}</p>`:''}<div class="items">${(o.order_items||[]).map(i=>`<div class="item"><span>${i.quantity}x ${i.product_name}</span><b>${money(Number(i.unit_price)*i.quantity)}</b></div>`).join('')}</div>${o.status==='Pedido recebido'?`<div class="quick"><button class="yes" onclick="status('${o.id}','Aceito')">✓ Aceitar</button><button class="no" onclick="status('${o.id}','Cancelado')">✕ Recusar</button></div>`:''}<select onchange="status('${o.id}',this.value)">${st.map(x=>`<option ${x===o.status?'selected':''}>${x}</option>`).join('')}</select></article>`).join(''):'<div class="empty">Nenhum pedido registrado ainda.</div>'}window.status=async(id,status)=>{const {error}=await sb.from('orders').update({status}).eq('id',id);if(error)return alert(error.message);load()};$('notify').onclick=async()=>{if(!('Notification'in window))return alert('Notificações indisponíveis neste navegador.');const p=await Notification.requestPermission();$('notify').textContent=p==='granted'?'🔔 Notificações ativas':'🔕 Notificações bloqueadas'};load();setInterval(load,10000);</script></body></html>
