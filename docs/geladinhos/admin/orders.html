<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff0f68"><title>Pedidos — Geladinho dos Sonhos</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script><style>:root{--p:#ff0f68;--p2:#ff4e8e;--w:#4a101e;--line:#efdde4;--muted:#78616a;--g:#19b15b;--amber:#f5a623;--red:#c9364d;--bg:#fff8fb}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial;background:linear-gradient(180deg,#fff8fb,#fff);color:#29171d}.wrap{max-width:1120px;margin:auto;padding:14px}.head{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;margin:-14px -14px 14px;padding:14px;background:#fffafcee;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.head h1{margin:0;color:var(--w);font-size:24px}.head small{display:block;color:var(--muted);font-size:11px}.head button{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-weight:850}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.sum{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}.sum small{color:var(--muted);font-size:11px}.sum b{display:block;font-size:22px;color:var(--w);margin-top:2px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.order{position:relative;background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:0 14px 34px rgba(99,23,51,.08)}.order.new{border:2px solid var(--p);box-shadow:0 18px 42px rgba(255,15,104,.18)}.order.new:before{content:"";position:absolute;inset:-2px;border-radius:20px;box-shadow:0 0 0 4px rgba(255,15,104,.06);pointer-events:none}.topline{display:flex;gap:8px;align-items:flex-start}.tag{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(90deg,var(--p),var(--p2));color:#fff;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:950}.statusTag{margin-left:auto;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:900;background:#f7eff2;color:#6e4050}.order h3{margin:10px 0 4px;color:#3e1220;font-size:18px}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.pill{background:#fff4f7;border:1px solid #f5d9e3;border-radius:99px;padding:5px 8px;font-size:12px;font-weight:800}.price{color:var(--p);font-weight:950}.contact{display:grid;gap:7px;margin:10px 0}.contact a,.contact div{display:flex;align-items:flex-start;gap:7px;text-decoration:none;color:#4c313a;font-size:13px;background:#fffafd;border:1px solid #f4e3e9;border-radius:12px;padding:9px 10px}.contact a[href^="tel"]{font-weight:900;color:#2b6a45}.items{background:#fff7fa;border:1px solid #f3e1e7;border-radius:14px;padding:10px;margin:10px 0}.itemsTitle{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:900;margin-bottom:6px}.item{display:flex;justify-content:space-between;gap:8px;padding:5px 0;font-size:13px;border-bottom:1px dashed #f0dfe5}.item:last-child{border-bottom:0}.notes{font-size:12px;color:#6c5660;background:#fff8ed;border:1px solid #f6e1bc;border-radius:12px;padding:9px;margin:9px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.actions button{border:0;border-radius:12px;padding:11px 9px;font-weight:950;font-size:13px}.accept{background:var(--g);color:#fff}.reject{background:#ffe8ed;color:#a51f3a}.prepare{background:#fff0d8;color:#945a00}.dispatch{background:#e8f1ff;color:#215d9c}.finish{background:#e5f8ec;color:#14753e}.back{background:#f3edf0;color:#694653}.more{margin-top:9px}.more select{width:100%;border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff;color:#59414a}.empty{text-align:center;color:var(--muted);padding:45px}.warn{background:#fff0f5;border:1px solid #ffc9db;padding:14px;border-radius:14px}.updated{font-size:11px;color:var(--muted);text-align:right;margin:8px 2px 0}@media(max-width:820px){.grid{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}.head h1{font-size:21px}.head button{font-size:12px;padding:9px}.order{padding:14px}.actions button{min-height:44px;font-size:14px}}@media(max-width:480px){.wrap{padding:10px}.head{margin:-10px -10px 10px;padding:10px}.summary{gap:6px}.sum{padding:9px}.sum b{font-size:19px}.order h3{font-size:17px}.meta{gap:5px}.pill{font-size:11px}.contact a,.contact div{font-size:12px}.actions{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><div class="head"><div><h1>Pedidos</h1><small>Geladinho dos Sonhos</small></div><button id="notify">🔔 Notificações</button></div><div id="msg"></div><div id="summary" class="summary"></div><div id="grid" class="grid"></div><div id="updated" class="updated"></div></div><script>const {createClient}=supabase,sb=createClient('https://qpqruhcspbdxjcnbhdhn.supabase.co','sb_publishable_JVYvfl7nrRmlm17qF_KI8A_1H8mtvLk'),$=x=>document.getElementById(x),money=v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});let seen=new Set(),ready=false;async function admin(){const {data:{session}}=await sb.auth.getSession();if(!session)return false;const {data}=await sb.from('admin_users').select('user_id').maybeSingle();return !!data}function address(o){if(o.fulfillment!=='entrega'||!o.address)return 'Retirada no local';const a=o.address;return `${a.street||''}, ${a.number||''}${a.complement?' · '+a.complement:''} · ${a.district||''}${a.reference?' · Ref.: '+a.reference:''}`;}function ping(o){try{if(Notification.permission==='granted')new Notification('Novo pedido #'+o.public_code,{body:o.customer_name+' · '+money(o.total),icon:'../assets/logo-oficial.webp'})}catch(_){}}function nextButtons(o){if(o.status==='Pedido recebido')return `<button class="accept" onclick="setStatus('${o.id}','Aceito')">✓ Aceitar</button><button class="reject" onclick="setStatus('${o.id}','Cancelado')">✕ Recusar</button>`;if(o.status==='Aceito')return `<button class="prepare" onclick="setStatus('${o.id}','Em preparação')">👩‍🍳 Iniciar preparo</button><button class="back" onclick="setStatus('${o.id}','Cancelado')">Cancelar</button>`;if(o.status==='Em preparação'&&o.fulfillment==='entrega')return `<button class="dispatch" onclick="setStatus('${o.id}','Saiu para entrega')">🛵 Saiu p/ entrega</button><button class="finish" onclick="setStatus('${o.id}','Entregue')">✓ Entregue</button>`;if(o.status==='Em preparação')return `<button class="finish" onclick="setStatus('${o.id}','Entregue')">✓ Pronto/Entregue</button><button class="back" onclick="setStatus('${o.id}','Cancelado')">Cancelar</button>`;if(o.status==='Saiu para entrega')return `<button class="finish" onclick="setStatus('${o.id}','Entregue')">✓ Marcar entregue</button><button class="back" onclick="setStatus('${o.id}','Em preparação')">↶ Voltar</button>`;return `<button class="back" onclick="setStatus('${o.id}','Pedido recebido')">↶ Reabrir pedido</button>`}function summary(orders){const novo=orders.filter(o=>o.status==='Pedido recebido').length,prep=orders.filter(o=>['Aceito','Em preparação'].includes(o.status)).length,rota=orders.filter(o=>o.status==='Saiu para entrega').length,abertos=orders.filter(o=>!['Entregue','Cancelado'].includes(o.status)).length;$('summary').innerHTML=`<div class="sum"><small>Novos</small><b>${novo}</b></div><div class="sum"><small>Preparando</small><b>${prep}</b></div><div class="sum"><small>Na rua</small><b>${rota}</b></div><div class="sum"><small>Em aberto</small><b>${abertos}</b></div>`}async function load(){if(!await admin()){$('msg').innerHTML='<div class="warn">Entre primeiro na aba <b>Administrar</b> com sua conta.</div>';$('grid').innerHTML='';$('summary').innerHTML='';return}const {data,error}=await sb.from('orders').select('*,order_items(*)').order('created_at',{ascending:false}).limit(100);if(error){$('msg').textContent=error.message;return}const orders=data||[];if(ready)orders.filter(o=>o.status==='Pedido recebido'&&!seen.has(o.id)).forEach(ping);orders.forEach(o=>seen.add(o.id));ready=true;summary(orders);render(orders);$('updated').textContent='Atualizado às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}function render(orders){const st=['Pedido recebido','Aceito','Em preparação','Saiu para entrega','Entregue','Cancelado'];$('grid').innerHTML=orders.length?orders.map(o=>`<article class="order ${o.status==='Pedido recebido'?'new':''}"><div class="topline">${o.status==='Pedido recebido'?'<span class="tag">🔔 NOVO PEDIDO</span>':''}<span class="statusTag">${o.status}</span></div><h3>#${o.public_code} · ${o.customer_name}</h3><div class="meta"><span class="pill price">${money(o.total)}</span><span class="pill">${o.fulfillment==='entrega'?'🛵 Entrega':'🏠 Retirada'}</span></div><div class="contact"><a href="tel:${o.customer_phone||''}">📱 ${o.customer_phone||'Sem telefone'}</a><div>${o.fulfillment==='entrega'?'📍':'🏠'} ${address(o)}</div></div>${o.notes?`<div class="notes">📝 ${o.notes}</div>`:''}<div class="items"><div class="itemsTitle">Itens do pedido</div>${(o.order_items||[]).map(i=>`<div class="item"><span><b>${i.quantity}x</b> ${i.product_name}</span><b>${money(Number(i.unit_price)*i.quantity)}</b></div>`).join('')}</div><div class="actions">${nextButtons(o)}</div><div class="more"><select onchange="setStatus('${o.id}',this.value)">${st.map(x=>`<option ${x===o.status?'selected':''}>${x}</option>`).join('')}</select></div></article>`).join(''):'<div class="empty">Nenhum pedido registrado ainda.</div>'}window.setStatus=async(id,status)=>{const {error}=await sb.from('orders').update({status}).eq('id',id);if(error)return alert(error.message);load()};$('notify').onclick=async()=>{if(!('Notification'in window))return alert('Notificações indisponíveis neste navegador.');const p=await Notification.requestPermission();$('notify').textContent=p==='granted'?'🔔 Ativas':'🔕 Bloqueadas'};load();setInterval(load,8000);</script></body></html>
