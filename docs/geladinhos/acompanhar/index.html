<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acompanhar pedido — Geladinho dos Sonhos</title>
<style>
:root{--p:#ff0f68;--w:#4a101e;--line:#efdde4;--muted:#78616a}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial;background:linear-gradient(#fff6fa,#fff);color:#29171d}.wrap{max-width:620px;margin:auto;padding:28px 16px}.logo{display:block;width:160px;margin:0 auto 12px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 18px 45px rgba(106,25,54,.09)}h1{color:var(--w);text-align:center;margin:8px 0}p{color:var(--muted);text-align:center;line-height:1.5}.search{display:flex;gap:8px;margin:18px 0}.search input{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit}.search button{border:0;background:var(--p);color:#fff;border-radius:12px;padding:0 16px;font-weight:900}.status{display:none;margin-top:18px}.status.show{display:block}.steps{display:grid;gap:10px}.step{border:1px solid var(--line);border-radius:13px;padding:12px;color:var(--muted)}.step.on{background:#fff0f5;border-color:#ffc1d6;color:var(--w);font-weight:800}.note{font-size:12px;margin-top:18px}
</style></head>
<body><div class="wrap"><img class="logo" src="../assets/logo.webp" alt="Geladinho dos Sonhos"><div class="card"><h1>Acompanhar pedido</h1><p>Digite o código recebido ao finalizar seu pedido.</p><div class="search"><input id="code" placeholder="Ex.: GD1024"><button onclick="lookup()">Consultar</button></div><div id="result" class="status"><div class="steps"><div class="step on">Pedido recebido</div><div class="step">Aceito</div><div class="step">Em preparação</div><div class="step">Saiu para entrega</div><div class="step">Entregue</div></div><p class="note">O acompanhamento em tempo real será ativado quando o banco de dados da loja estiver conectado.</p></div></div></div>
<script>function lookup(){const v=code.value.trim();if(!v)return alert('Digite o código do pedido.');result.classList.add('show')}</script></body></html>
