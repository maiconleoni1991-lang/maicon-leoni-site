name: Publicar V2 final Geladinho dos Sonhos

on:
  push:
    paths:
      - '.github/workflows/publish-geladinhos-v2-final.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar V2 final conectada ao Supabase
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re

          root=Path('docs/geladinhos')
          assets=root/'assets'
          assets.mkdir(parents=True,exist_ok=True)

          # Recupera a V2 visual aprovada que já está preservada no repositório.
          source=Path('.github/workflows/restore-geladinhos-v2.yml').read_text(encoding='utf-8')
          m=re.search(r"html_b64 = '([^']+)'",source)
          if not m: raise RuntimeError('Base V2 não encontrada')
          s=base64.b64decode(m.group(1)).decode('utf-8')

          # Identidade e nomenclatura atuais.
          s=s.replace('Tradicionais, ao leite e gourmets, com retirada grátis ou entrega.','Tradicionais, cremosos e gourmets, com retirada grátis ou entrega.')
          s=s.replace("./assets/products-v2.webp'","./assets/products-v2.webp?v=5'")
          s=s.replace("./assets/hero-v2.webp'","./assets/hero-v2.webp?v=5'")
          s=s.replace('./assets/logo-v2.webp','./assets/logo-oficial.webp?v=5')
          s=s.replace('Ao Leite','Cremoso')

          # Liga o catálogo da V2 ao Supabase sem alterar o design.
          s=s.replace('const products=[','const fallbackProducts=[',1)
          needle="];\n\nconst money=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});"
          insert="];\nlet products=[...fallbackProducts];\n\nconst SUPABASE_URL='https://qpqruhcspbdxjcnbhdhn.supabase.co';\nconst SUPABASE_KEY='sb_publishable_JVYvfl7nrRmlm17qF_KI8A_1H8mtvLk';\nconst imgIndexBySlug={\n  'trad-morango':0,'leite-morango':1,'leite-ninho':2,'leite-milho':3,'leite-chocolate':4,\n  'leite-uva':5,'leite-maracuja':6,'leite-mamao':7,'gourmet-maracuja':8,'gourmet-morango':9\n};\nasync function loadProducts(){\n  try{\n    const url=`${SUPABASE_URL}/rest/v1/products?select=slug,name,category,description,price,stock,active,image_url,sort_order&order=sort_order.asc`;\n    const r=await fetch(url,{headers:{apikey:SUPABASE_KEY}});\n    if(!r.ok) throw new Error('Falha ao carregar catálogo');\n    const rows=await r.json();\n    if(Array.isArray(rows)&&rows.length){\n      products=rows.map(x=>({\n        id:x.slug,name:x.name,cat:x.category,price:Number(x.price),img:imgIndexBySlug[x.slug]??null,\n        imageUrl:x.image_url||'',desc:x.description||'',active:!!x.active&&Number(x.stock)>0,stock:Number(x.stock)||0\n      }));\n    }\n  }catch(e){console.warn('Catálogo online indisponível; usando cópia local.',e);products=[...fallbackProducts]}\n  render();updateCartCount();\n}\n\nconst money=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});"
          if needle not in s: raise RuntimeError('Ponto de injeção do catálogo não encontrado')
          s=s.replace(needle,insert,1)
          s=s.replace('<div class="photo p${p.img}" role="img" aria-label="${p.name}"></div>', '<div class="photo ${p.img!==null?`p${p.img}`:\'\'}" ${p.imageUrl?`style="background-image:url(\'${p.imageUrl.replace(/\'/g,\'%27\')}\');background-size:cover;background-position:center"`:\'\'} role="img" aria-label="${p.name}"></div>',1)
          s=s.replace("document.getElementById('openTrack').onclick=()=>document.getElementById('trackOverlay').classList.add('show');","document.getElementById('openTrack').onclick=()=>{window.location.href='./acompanhar/'};",1)
          s=s.replace('render();updateCartCount();\n</script>','loadProducts();\n</script>',1)
          (root/'index.html').write_text(s,encoding='utf-8')

          # Reconstrói os ativos V2 e o logo wordmark aprovado (chapéu + coração).
          def decode_chunks(names,out):
              data=''.join((root/'assets-v2'/n).read_text(encoding='utf-8').strip() for n in names)
              data += '='*((4-len(data)%4)%4)
              raw=base64.b64decode(data)
              if raw[:4]!=b'RIFF' or raw[8:12]!=b'WEBP': raise RuntimeError(out+' inválido')
              (assets/out).write_bytes(raw)
          decode_chunks(['hero-1.txt','hero-2.txt','hero-3.txt'],'hero-v2.webp')
          decode_chunks(['products-1.txt','products-2.txt','products-3.txt'],'products-v2.webp')
          decode_chunks(['logo-1.txt','logo-2.txt'],'logo-oficial.webp')

          # Mesmo logo oficial no painel.
          for rel in ['admin/index.html','admin/manage.html']:
              p=root/rel; t=p.read_text(encoding='utf-8')
              t=t.replace('../assets/logo.webp','../assets/logo-oficial.webp?v=5')
              t=t.replace('../assets/logo-oficial.webp?v=3','../assets/logo-oficial.webp?v=5')
              t=t.replace('../assets/logo-oficial.webp?v=4','../assets/logo-oficial.webp?v=5')
              p.write_text(t,encoding='utf-8')

          # Bloqueia publicação se algo essencial estiver errado.
          final=(root/'index.html').read_text(encoding='utf-8')
          for term in ['Cremoso','SUPABASE_URL','logo-oficial.webp?v=5','hero-v2.webp?v=5','products-v2.webp?v=5']:
              if term not in final: raise RuntimeError('Ausente: '+term)
          if 'Ao Leite' in final: raise RuntimeError('Categoria antiga presente')
          PY
      - name: Commit da loja V2 final
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/geladinhos/index.html docs/geladinhos/assets/hero-v2.webp docs/geladinhos/assets/products-v2.webp docs/geladinhos/assets/logo-oficial.webp docs/geladinhos/admin/index.html docs/geladinhos/admin/manage.html
          git diff --cached --quiet && exit 0
          git commit -m "Publica loja V2 aprovada com logo oficial e Supabase"
          git push
