name: Aplicar Geladinho dos Sonhos V2 final

on:
  push:
    paths:
      - '.github/workflows/apply-geladinhos-v2-final.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gravar arquivos finais validados
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip

          root = Path('docs/geladinhos')
          assets = root / 'assets'
          assets.mkdir(parents=True, exist_ok=True)

          public_b64 = ''''''
          shell_b64 = ''''''
          manage_b64 = ''''''

          def ungzip64(s):
              return gzip.decompress(base64.b64decode(s))

          (root/'index.html').write_bytes(ungzip64(public_b64))
          (root/'admin'/'index.html').write_bytes(ungzip64(shell_b64))
          (root/'admin'/'manage.html').write_bytes(ungzip64(manage_b64))

          def decode_chunks(names, out):
              txt=''.join((root/'assets-v2'/n).read_text(encoding='utf-8').strip() for n in names)
              txt += '='*((4-len(txt)%4)%4)
              raw=base64.b64decode(txt)
              if raw[:4] != b'RIFF' or raw[8:12] != b'WEBP':
                  raise RuntimeError(out+' não é WebP válido')
              (assets/out).write_bytes(raw)

          decode_chunks(['hero-1.txt','hero-2.txt','hero-3.txt'], 'hero-v2.webp')
          decode_chunks(['products-1.txt','products-2.txt','products-3.txt'], 'products-v2.webp')
          decode_chunks(['logo-1.txt','logo-2.txt'], 'logo-oficial.webp')

          public=(root/'index.html').read_text(encoding='utf-8')
          manage=(root/'admin'/'manage.html').read_text(encoding='utf-8')
          shell=(root/'admin'/'index.html').read_text(encoding='utf-8')
          for term in ['Cremoso','SUPABASE_URL','logo-oficial.webp?v=6','hero-v2.webp?v=6','products-v2.webp?v=6']:
              if term not in public: raise RuntimeError('Página pública sem '+term)
          if 'Ao Leite' in public or 'Ao Leite' in manage: raise RuntimeError('Categoria antiga encontrada')
          if 'logo-oficial.webp?v=6' not in manage or 'logo-oficial.webp?v=6' not in shell:
              raise RuntimeError('Logo oficial ausente no painel')
          print('VALIDADO: V2 + Cremoso + Supabase + logo oficial')
          PY
      - name: Publicar arquivos finais
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/geladinhos/index.html docs/geladinhos/admin/index.html docs/geladinhos/admin/manage.html docs/geladinhos/assets/hero-v2.webp docs/geladinhos/assets/products-v2.webp docs/geladinhos/assets/logo-oficial.webp
          git diff --cached --quiet && exit 0
          git commit -m "Restaura V2 aprovada com logo oficial e Supabase"
          git push
