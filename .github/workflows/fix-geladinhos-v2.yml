name: Corrigir publicacao V2 Geladinho dos Sonhos

on:
  push:
    paths:
      - '.github/workflows/fix-geladinhos-v2.yml'

permissions:
  contents: write

jobs:
  fix-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restaurar V2, ativos e logo oficial
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re

          root = Path('docs/geladinhos')
          assets = root / 'assets'
          assets.mkdir(parents=True, exist_ok=True)

          # Recupera o HTML V2 que já foi guardado na automação anterior.
          source = Path('.github/workflows/restore-geladinhos-v2.yml').read_text(encoding='utf-8')
          m = re.search(r"html_b64 = '([^']+)'", source)
          if not m:
              raise RuntimeError('HTML V2 não encontrado')
          html = base64.b64decode(m.group(1))
          (root / 'index.html').write_bytes(html)

          def decode_chunks(names, output):
              data = ''.join((root/'assets-v2'/n).read_text(encoding='utf-8').strip() for n in names)
              data += '=' * ((4 - len(data) % 4) % 4)
              raw = base64.b64decode(data)
              if raw[:4] != b'RIFF' or raw[8:12] != b'WEBP':
                  raise RuntimeError(f'{output} não é WebP válido')
              (assets/output).write_bytes(raw)

          decode_chunks(['hero-1.txt','hero-2.txt','hero-3.txt'], 'hero-v2.webp')
          decode_chunks(['products-1.txt','products-2.txt','products-3.txt'], 'products-v2.webp')
          # Estes dois fragmentos correspondem ao logo wordmark aprovado (chapéu + coração).
          decode_chunks(['logo-1.txt','logo-2.txt'], 'logo-oficial.webp')

          # Garante o logo correto também no painel administrativo.
          for rel in ['admin/index.html','admin/manage.html']:
              p = root / rel
              s = p.read_text(encoding='utf-8')
              s = s.replace('../assets/logo.webp', '../assets/logo-oficial.webp?v=4')
              s = s.replace('../assets/logo-oficial.webp?v=3', '../assets/logo-oficial.webp?v=4')
              p.write_text(s, encoding='utf-8')

          # Verificações mínimas do HTML público antes de publicar.
          s = (root/'index.html').read_text(encoding='utf-8')
          required = ['Cremoso','SUPABASE_URL','logo-oficial.webp','hero-v2.webp','products-v2.webp']
          missing = [x for x in required if x not in s]
          if missing:
              raise RuntimeError('Itens ausentes no HTML: ' + ', '.join(missing))
          if 'Ao Leite' in s:
              raise RuntimeError('Categoria antiga ainda presente')
          PY
      - name: Publicar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/geladinhos/index.html docs/geladinhos/assets/hero-v2.webp docs/geladinhos/assets/products-v2.webp docs/geladinhos/assets/logo-oficial.webp docs/geladinhos/admin/index.html docs/geladinhos/admin/manage.html
          git diff --cached --quiet && exit 0
          git commit -m "Restaura V2 aprovada e logo oficial da loja"
          git push
