name: Gerar ícones PWA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-pwa-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Pillow
        run: python -m pip install --quiet Pillow
      - name: Gerar ícones do logo oficial
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path

          root = Path('docs/geladinhos')
          src = Image.open(root/'assets/logo-oficial.webp').convert('RGBA')
          bg = (255, 240, 245, 255)

          def make(size, scale, name):
              canvas = Image.new('RGBA', (size, size), bg)
              box = int(size * scale)
              logo = ImageOps.contain(src, (box, box), Image.Resampling.LANCZOS)
              x = (size - logo.width) // 2
              y = (size - logo.height) // 2
              canvas.alpha_composite(logo, (x, y))
              canvas.convert('RGB').save(root/'assets'/name, 'PNG', optimize=True)

          make(192, 0.86, 'icon-192.png')
          make(512, 0.86, 'icon-512.png')
          make(512, 0.68, 'icon-maskable-512.png')
          make(180, 0.82, 'apple-touch-icon.png')
          make(32, 0.90, 'favicon-32.png')
          PY
      - name: Commit dos ícones
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/geladinhos/assets/icon-192.png docs/geladinhos/assets/icon-512.png docs/geladinhos/assets/icon-maskable-512.png docs/geladinhos/assets/apple-touch-icon.png docs/geladinhos/assets/favicon-32.png
          if git diff --cached --quiet; then
            echo "Ícones já estão atualizados."
          else
            git commit -m "Gerar ícones PWA do logo oficial"
            git push
          fi
