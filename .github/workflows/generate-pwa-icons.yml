name: Gerar ícones PWA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-pwa-icons.yml'
      - 'docs/geladinhos/assets/app-icon.svg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar renderizador SVG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
      - name: Gerar PNGs PWA
        run: |
          SRC="docs/geladinhos/assets/app-icon.svg"
          OUT="docs/geladinhos/assets"
          rsvg-convert -w 192 -h 192 "$SRC" > "$OUT/icon-192.png"
          rsvg-convert -w 512 -h 512 "$SRC" > "$OUT/icon-512.png"
          rsvg-convert -w 512 -h 512 "$SRC" > "$OUT/icon-maskable-512.png"
          rsvg-convert -w 180 -h 180 "$SRC" > "$OUT/apple-touch-icon.png"
          rsvg-convert -w 32 -h 32 "$SRC" > "$OUT/favicon-32.png"
          file "$OUT/icon-192.png" "$OUT/icon-512.png" "$OUT/icon-maskable-512.png" "$OUT/apple-touch-icon.png" "$OUT/favicon-32.png"
      - name: Commit dos ícones
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/geladinhos/assets/icon-192.png docs/geladinhos/assets/icon-512.png docs/geladinhos/assets/icon-maskable-512.png docs/geladinhos/assets/apple-touch-icon.png docs/geladinhos/assets/favicon-32.png
          if git diff --cached --quiet; then
            echo "Ícones já estão atualizados."
          else
            git commit -m "Gerar ícones PWA do Geladinho dos Sonhos"
            git push
          fi
