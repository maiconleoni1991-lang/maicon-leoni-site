name: Gerar ícones PWA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-pwa-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Gerar PNGs a partir do logo oficial
        run: |
          SRC="docs/geladinhos/assets/logo-oficial.webp"
          OUT="docs/geladinhos/assets"
          ffmpeg -y -i "$SRC" -frames:v 1 -vf "scale=165:165:force_original_aspect_ratio=decrease,pad=192:192:(ow-iw)/2:(oh-ih)/2:color=0xfff0f5" "$OUT/icon-192.png"
          ffmpeg -y -i "$SRC" -frames:v 1 -vf "scale=440:440:force_original_aspect_ratio=decrease,pad=512:512:(ow-iw)/2:(oh-ih)/2:color=0xfff0f5" "$OUT/icon-512.png"
          ffmpeg -y -i "$SRC" -frames:v 1 -vf "scale=348:348:force_original_aspect_ratio=decrease,pad=512:512:(ow-iw)/2:(oh-ih)/2:color=0xfff0f5" "$OUT/icon-maskable-512.png"
          ffmpeg -y -i "$SRC" -frames:v 1 -vf "scale=148:148:force_original_aspect_ratio=decrease,pad=180:180:(ow-iw)/2:(oh-ih)/2:color=0xfff0f5" "$OUT/apple-touch-icon.png"
          ffmpeg -y -i "$SRC" -frames:v 1 -vf "scale=29:29:force_original_aspect_ratio=decrease,pad=32:32:(ow-iw)/2:(oh-ih)/2:color=0xfff0f5" "$OUT/favicon-32.png"
          file "$OUT/icon-192.png" "$OUT/icon-512.png" "$OUT/icon-maskable-512.png" "$OUT/apple-touch-icon.png" "$OUT/favicon-32.png"
      - name: Commit dos ícones
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/geladinhos/assets/icon-192.png docs/geladinhos/assets/icon-512.png docs/geladinhos/assets/icon-maskable-512.png docs/geladinhos/assets/apple-touch-icon.png docs/geladinhos/assets/favicon-32.png
          if git diff --cached --quiet; then
            echo "Ícones já estão atualizados."
          else
            git commit -m "Gerar ícones PWA do logo oficial"
            git push
          fi
